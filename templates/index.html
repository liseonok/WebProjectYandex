{% extends "base.html" %}

{% block content %}
<h1 class="mt-4 mb-4">Карта необычных мест</h1>

<div class="mb-3">
    {% if current_user.is_authenticated %}
        <a href="/add_place" class="btn btn-purple">Добавить место</a>
        <a href="/profile" class="btn btn-outline-secondary ml-2">Профиль</a>
    {% else %}
        <a href="/login" class="btn btn-purple">Войти, чтобы добавить место</a>
    {% endif %}
</div>

<div id="map" style="width: 100%; height: 500px; border-radius: 12px;"></div>

<script src="https://api-maps.yandex.ru/2.1/?apikey=79d631f0-9469-4ff4-835b-4498b7ffe6de&lang=ru_RU" type="text/javascript"></script>

<script>
    ymaps.ready(init);

    function init() {
        const myMap = new ymaps.Map("map", {
            center: [55.751244, 37.618423],
            zoom: 11
        });

        {% for place in places %}
            const placemark{{ place.id }} = new ymaps.Placemark(
                [{{ place.latitude }}, {{ place.longitude }}],
                {
                    balloonContentHeader: "{{ place.name|e }}",
                    balloonContentBody: `
                        <p>{{ place.description|truncate(120)|e }}</p>
                        <a href="/place/{{ place.id }}">Открыть описание</a>
                    `,
                    hintContent: "{{ place.name|e }}"
                }
            );

            myMap.geoObjects.add(placemark{{ place.id }});
        {% endfor %}
    }
</script>
{% endblock %}
